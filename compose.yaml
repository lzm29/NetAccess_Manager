name: netaccess-manager
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup-env.ps1 first}
      MYSQL_DATABASE: netaccess_manager
      MYSQL_USER: netaccess_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run setup-env.ps1 first}
    ports:
      - '127.0.0.1:3308:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM roles" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  web:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: netaccess_manager
      DB_USER: netaccess_app
      DB_PASSWORD: ${DB_PASSWORD:?Run setup-env.ps1 first}
      SECRET_KEY: ${SECRET_KEY:?Run setup-env.ps1 first}
      PYTHONUNBUFFERED: '1'
    ports:
      - '127.0.0.1:8080:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  mysql_data:
